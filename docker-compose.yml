services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget_tracker
      POSTGRES_PASSWORD: budget_tracker
      POSTGRES_DB: budget_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
